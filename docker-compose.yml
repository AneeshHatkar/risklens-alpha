services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: risklens-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - RISKLENS_DATABASE_URL=sqlite:////app/data/risklens_alpha.db
      - CHROME_BIN=/usr/bin/chromium
    volumes:
      - risklens_data:/app/data
      - risklens_cache:/app/.cache/risklens
      - ./reports:/app/reports
      - ./outputs:/app/outputs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risklens-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  risklens_data:
  risklens_cache:
